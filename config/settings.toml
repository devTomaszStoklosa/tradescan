# tradescan settings. Every key is optional; missing keys fall back to built-in defaults.
# Percent values are written as percents (1.0 means 1%).

[data]
period = "5y"            # yfinance period used by `scan` and `market`
interval = "1d"
cache_dir = ".cache"
cache_ttl_hours = 12

[account]
equity = 100000
risk_pct = 1.0           # capital risked per trade
max_position_pct = 25.0  # cap on position value as % of equity
lot_size = 1             # use e.g. 0.0001 for crypto

[risk]
atr_period = 14
atr_mult = 2.0           # stop distance = atr_mult * ATR
targets_r = [2.0, 3.0]   # profit targets as multiples of the risk

[scan]
fresh_bars = 3           # a signal counts if it fired within the last N bars
min_score = 1.0
benchmark = "SPY"        # used when the watchlist has no `# benchmark:` line
edge_horizon = 10        # bars used for the historical edge column
min_bars = 60            # tickers with less history are skipped

[scoring]
trend_bonus = 1.0        # +/- when the daily trend agrees/disagrees with the direction
weekly_bonus = 1.0       # +/- for the weekly trend (30-week SMA)
rs_bonus = 1.0           # + for relative strength in the top (long) / bottom (short) bucket
rs_strong_pct = 80.0

[scoring.family_weights]
trend = 1.0
momentum = 1.0
breakout = 1.5
mean_reversion = 1.0
volume = 1.0
pattern = 0.5

[scoring.signal_weights]
# Per-signal overrides, e.g.:
# golden_cross = 2.0

[trend]
fast_period = 50         # daily trend: close and SMA(fast) vs SMA(slow)
slow_period = 200
weekly_period = 30       # weekly trend: close vs a rising/falling 30-week SMA
rs_periods = [63, 126, 189, 252]   # relative strength: returns over these lookbacks...
rs_weights = [0.4, 0.2, 0.2, 0.2]  # ...weighted like this (IBD style), then ranked within the universe

[regime]
fast_period = 50         # breadth: % of the universe above SMA(fast)
slow_period = 200        # benchmark trend: close vs SMA(slow)
high_low_period = 252    # window for new highs / new lows
risk_on_breadth = 60.0   # risk-on needs the benchmark above SMA(slow) and breadth at or above this
risk_off_breadth = 40.0  # risk-off needs the benchmark below SMA(slow) and breadth at or below this

[backtest]
period = "10y"           # history used by `backtest` and `edge`
commission_pct = 0.1
slippage_pct = 0.05
bars_per_year = 252
oos_pct = 30.0           # last % of the history reported as out-of-sample (left out of tuning)
# Entry and exit rules (target, time exit, ...) and their parameters are chosen per backtest.

[pyramid]
max_units = 1            # the first entry plus the adds of a single-ticker backtest; 1 turns pyramiding off
add_every_atr = 0.5      # another unit once price moves this many ATRs (of the signal bar) from the last fill

[monte_carlo]
simulations = 1000       # resampled sequences of a backtest's closed trades, per method
ruin_drawdown_pct = 50.0 # a drawdown from the peak at least this deep counts as ruin
seed = 0                 # the same seed repeats the same simulations

[portfolio]
max_positions = 10       # open positions plus entry orders waiting to fill, in a portfolio backtest
max_exposure_pct = 100.0 # gross value of positions and waiting orders as % of equity; above 100 is leverage
# The priority rule (which signals go first when more fire than there is room for) is chosen per backtest.

[rotation]
holdings = 5             # tickers a momentum rotation holds after each rebalance
absolute_lookback = 252  # a pick whose return over this many bars is at or below 0 goes to the safe asset or cash; 0: off
# The ranking and weighting rules, the rebalance frequency and the safe asset are chosen per run.
