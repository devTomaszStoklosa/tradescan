<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="tradescan: trading signal scanner, edge statistics and backtests" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>tradescan</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colours.
      (function () {
        var choice = "system";
        try {
          choice = JSON.parse(localStorage.getItem("tradescan.theme")) || "system";
        } catch (error) {}
        var dark = choice === "dark" || (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
